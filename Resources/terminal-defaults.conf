# MyTerminal 기본 터미널 설정 (Ghostty 설정 형식)
# 사용자 설정은 ~/Library/Application Support/MyTerminal/terminal.conf 에 두면 이 값을 덮어씁니다.

# TERM 은 설정 화면에서 정한다 (기본 xterm-256color, 고급 옵션으로 xterm-ghostty).
# xterm-ghostty 는 번들 terminfo 를 쓰지만, setuid 프로그램(top)과 sudo 는 TERMINFO 를 무시해 실패한다.
# SSH 화면은 원격 서버 호환을 위해 항상 xterm-256color 로 덮어쓴다 (TerminalPane).

# Ghostty 셸 통합: 명령이 끝날 때 종료 코드(AI "왜 실패했나요?"), 현재 폴더 표시에 쓴다.
# 로컬 셸(zsh·bash·fish)에만 적용되고 SSH 화면(ssh 직접 실행)에는 적용되지 않는다.
# cursor(프롬프트에서 커서 모양 바꾸기)는 설정 화면의 커서 모양을 덮어쓰므로, path(PATH 에 엔진 폴더 추가)는 필요 없어서 끈다.
shell-integration = detect
shell-integration-features = no-cursor,no-path

window-padding-x = 10
window-padding-y = 8
confirm-close-surface = false

# 색상·글꼴·커서·Option 키는 설정 화면(⌘,)에서 정한다 → settings.conf
# (배경·글자색을 여기 쓰면 테마보다 우선하므로 쓰지 않는다)
